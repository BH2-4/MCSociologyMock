services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agorasim
      POSTGRES_USER: agorasim
      POSTGRES_PASSWORD: agorasim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agorasim"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - agorasim-postgres:/var/lib/postgresql/data

volumes:
  agorasim-postgres:
