services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gesellschaft
      POSTGRES_USER: gesellschaft
      POSTGRES_PASSWORD: gesellschaft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gesellschaft"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - gesellschaft-postgres:/var/lib/postgresql/data

volumes:
  gesellschaft-postgres:
